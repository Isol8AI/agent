name: Private Isol8 Candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated v2026.9.3-isol8.N candidate tag
        required: true
        type: string
      release_sha:
        description: Full lowercase candidate commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: isol8-private-agent-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: blacksmith-8vcpu-ubuntu-2204
    permissions:
      contents: read
      packages: write
    env:
      CANDIDATE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate dispatch inputs
        run: |
          [[ "$CANDIDATE_TAG" =~ ^v2026\.9\.3-isol8\.[1-9][0-9]*$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate source and remote tag
        id: candidate
        run: node scripts/isol8-candidate-release.mjs identity
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require private package and positively absent candidate tag
        env:
          TAG_OBJECT: ${{ steps.candidate.outputs.object }}
        run: node scripts/isol8-candidate-release.mjs absent
      - name: Build and push one amd64 candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/thelightbulbcompany/agent:${{ steps.candidate.outputs.version }}
          sbom: true
          provenance: mode=max
          build-args: |
            GIT_COMMIT=${{ inputs.release_sha }}
            OPENCLAW_BUILD_TIMESTAMP=${{ steps.candidate.outputs.created }}
            OPENCLAW_DOCKER_BUILD_VERSION=${{ steps.candidate.outputs.version }}
            OPENCLAW_EXTENSIONS=diagnostics-otel,codex
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.release_sha }}
            org.opencontainers.image.version=${{ steps.candidate.outputs.version }}
            org.opencontainers.image.created=${{ steps.candidate.outputs.created }}
      - name: Verify remote tag and registry digest before handoff
        env:
          TAG_OBJECT: ${{ steps.candidate.outputs.object }}
          BUILD_CREATED: ${{ steps.candidate.outputs.created }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/isol8-candidate-release.mjs proof
